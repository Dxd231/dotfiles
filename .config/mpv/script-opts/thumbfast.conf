# STOP THUMBFAST FROM PRE-RENDERING ON PAUSE
# Prevent the background instance from constantly updating if you pause 
# and hover over the timeline.
spawn_first=no

# FORCE CACHED THUMBNAILS
# Reduces how aggressively thumbfast demands new decodes the moment execution halts.
min_duration=0.5

# DISABLE NETWORK SEEK PREVIEWS ON PAUSE
# If you pause local/streamed media, thumbfast shouldn't block the UI thread waiting for frame hooks.
network=no

# DIRECT HARDWARE ENGINE
# Crucial: Ensure it's not falling back to software decode on freeze events.
hwdec=auto-safe
