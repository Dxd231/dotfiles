input-ipc-server=/tmp/mpv-socket

keep-open=yes

save-position-on-quit=yes

sub-auto=fuzzy

resume-playback=yes

watch-later-options=vid,aid,sid,volume,start,speed,sub-visibility,sub-delay,secondary-sid,secondary-sub-visibility,audio-delay

profile=high-quality

alang=ja

sub-font=Zen Maru Gothic
sub-bold=no
sub-font-size=45

ytdl-raw-options=sub-langs="ja.*",write-subs=,write-auto-subs=

audio-stream-silence=yes
ao=pipewire

vo=gpu

[no-hwdec-hevc10]
profile-cond=get("video-params/bit-depth") == 10 and get("video-format") == "hevc"
hwdec=no
