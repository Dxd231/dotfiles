# Maximum allowable gamma multiplier (100% - 200%)
max-gamma = 150

# Morning / Daytime (6:00 AM - 6:00 PM)
# Full color fidelity, standard gamma
profile {
    time = 7:00
    identity = true
}

profile {
    time = 18:00
    temperature = 5200
}

# Late Night / Deep Focus (10:00 PM - 6:00 AM)
# Aggressive blue light filter (3500K) + reduced brightness
profile {
    time = 24:00
    temperature = 4500
}
